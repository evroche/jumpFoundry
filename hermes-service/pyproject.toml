[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collage-service"
version = "0.1.0"
description = "Hermes-facing backend service for the collage stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "hermes_image_search*"]

[tool.setuptools.package-data]
hermes_image_search = ["plugin.yaml", "skills/*/SKILL.md"]

[project.entry-points."hermes_agent.plugins"]
image-search = "hermes_image_search"

[tool.pytest.ini_options]
testpaths = ["tests"]
